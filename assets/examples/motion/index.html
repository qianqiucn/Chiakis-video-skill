<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>lib/motion demo (R1 + R2)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { position: relative; margin: 0 auto; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #000; overflow: hidden; }
  #bar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; }
  #bar button { background: #222; color: #eee; border: 1px solid #444; padding: 6px 16px; cursor: pointer; }
  #t3-seek { flex: 1; }
  #t3-time { font: 13px Consolas, monospace; min-width: 300px; }
  #credit { font-size: 11px; color: #666; }
  body.bare #bar { display: none; }
</style>
<script>window.T3_CONFIG = { fps: 24, start: 0, end: 12 };</script>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar">
  <button id="t3-play">播放</button>
  <input id="t3-seek" type="range">
  <span id="t3-time"></span>
  <span id="credit">lib/motion 演示，第 1 页 R1、第 2 页 R2（占位图形，无项目素材）· 空格播放/暂停，←→逐帧，Shift+←→ 跳 1 秒</span>
</div>
<!-- the template's own files, in the order a new project loads them (motion-library «Setup») -->
<script src="../../template/engine.js"></script>
<script src="../../template/lib/gsap/gsap.min.js"></script>
<script src="../../template/lib/gsap/CustomEase.min.js"></script>
<script src="../../template/lib/gsap-bridge.js"></script>
<script src="../../template/lib/motion/ez.js"></script>
<script src="../../template/lib/motion/probe.js"></script>
<script src="../../template/lib/motion/moves.js"></script>
<script src="../../template/lib/motion/blur.js"></script>
<script src="../../template/lib/motion/timing.js"></script>
<script src="../../template/lib/motion/her2d.js"></script>
<!-- optional lib, for T3.her.warp2 (the her shot on page 2) -->
<script src="../../template/lib/meshwarp.js"></script>
<script src="demo.js"></script>
</body>
</html>
